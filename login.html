<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Laguna com Lula</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f0f0;--surface:#fff;--ink:#1b1114;--ink2:#55474b;--muted:#857579;--line:#e4dadc;--red:#d0121f;--on-red:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#140f10;--surface:#1c1416;--ink:#f6eff0;--ink2:#cfc2c5;--muted:#a29599;--line:#35292c;--red:#ef3340}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{background:var(--red);color:var(--on-red);padding:28px 16px 24px}header div{max-width:420px;margin:auto}
.cap{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.85}
h1{font:800 clamp(40px,10vw,60px)/.9 "Barlow Condensed",Arial Narrow,sans-serif;text-transform:uppercase;margin:6px 0 0}
main{padding:28px 16px}form{max-width:420px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 20px;display:grid;gap:14px}
h2{font:700 22px "Barlow Condensed",sans-serif;margin:0}label{display:grid;gap:4px;font-weight:600;font-size:14.5px}
input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 11px}
input:focus{outline:2px solid var(--red);outline-offset:1px}
button{font:700 16px Barlow,sans-serif;background:var(--red);color:var(--on-red);border:0;border-radius:4px;padding:11px;cursor:pointer}
.msg{font-size:14px;border-radius:4px;padding:8px 10px;background:rgba(208,18,31,.08);color:var(--red)}.ok{background:rgba(10,107,10,.1);color:#0a6b0a}
.note{font-size:13.5px;color:var(--muted);margin:0}
</style></head><body>
<header><div><div class="cap">Laguna/SC · Federação Brasil da Esperança</div><h1>Laguna com Lula</h1></div></header>
<main><form method="post" action="/api/login">
<h2>Acesso ao painel</h2>
<div id="m" hidden></div>
<label>E-mail<input type="email" name="email" autocomplete="username" required autofocus></label>
<label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
<input type="hidden" name="volta" id="volta">
<button>Entrar</button>
<p class="note">O acesso é restrito. Para pedir um login, fale com a coordenação do Diretório.</p>
</form></main>
<script>
const q=new URLSearchParams(location.search),m=document.getElementById('m');
document.getElementById('volta').value=q.get('volta')||'/';
if(q.get('erro')){m.hidden=false;m.className='msg';m.textContent='E-mail ou senha incorretos.'}
if(q.get('saiu')){m.hidden=false;m.className='msg ok';m.textContent='Você saiu do painel.'}
</script></body></html>
